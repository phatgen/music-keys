name = "piano-helper-api"
main = "index.js"
compatibility_date = "2024-09-23"

# KV namespace for song storage.
# After running `wrangler kv namespace create SONGS_KV`, paste the
# returned id below (replace the placeholder).
[[kv_namespaces]]
binding = "SONGS_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
